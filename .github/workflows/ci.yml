name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: Tests (race detector)
        run: go test -race -count=1 ./...
      - name: REST and SAP suites over the local backend (race detector)
        run: ZAKS_TEST_BACKEND=local go test -race -count=1 ./internal/restapi/... ./internal/contentrepo/...
      - name: Cross-compile for arm64 (build only; not run)
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/adapter

  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Markdown links and anchors
        run: python3 scripts/check_docs.py

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the ZAKS Drive image with a version
        run: docker build --target adapter --build-arg VERSION=0.0.0-ci -t zaks-drive:0.0.0-ci .
      - name: Server binary starts and reports that version (canonical and compatibility names)
        run: |
          docker run --rm --entrypoint /zaks-drive-server zaks-drive:0.0.0-ci version | tee /dev/stderr | grep -q '0.0.0-ci'
          docker run --rm --entrypoint /zaks-drive zaks-drive:0.0.0-ci version | grep -q '0.0.0-ci'
          docker run --rm --entrypoint /adapter zaks-drive:0.0.0-ci version | grep -q '0.0.0-ci'
          docker run --rm --entrypoint /zaks-drive-server zaks-drive:0.0.0-ci errors > /dev/null
      - name: Image version label matches
        run: |
          test "$(docker image inspect zaks-drive:0.0.0-ci --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "0.0.0-ci"

  installer:
    name: Installer and release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Release build, reproducibility and installer tests (no network, no credentials, nothing published)
        run: sh scripts/test_install.sh

# ZAKS Drive: production-style deployment on a Docker host (Ubuntu VM).
# The service keeps its name "adapter" on purpose: renaming it would leave the old container
# running next to the new one on upgrade (same ports). Use `docker compose ... exec adapter /zaks-drive check`
# ("/adapter" still works).
#   cp deploy/.env.example deploy/.env   # fill in secrets
#   cp deploy/config.example.yaml deploy/config.yaml   # edit repositories
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  adapter:
    build:
      context: ..
      target: adapter
      args:
        VERSION: ${ZAKS_DRIVE_VERSION:-dev}
    # Set ZAKS_DRIVE_VERSION (see scripts/version.sh) to build and run a versioned image.
    # "latest" is only the default tag of your own local build; it is not a stability guarantee.
    image: zaks-drive:${ZAKS_DRIVE_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      CONFIG_FILE: /etc/adapter/config.yaml   # lets `exec adapter /zaks-drive check` find the config
      STATE_DIR: /var/lib/zaks-drive                # repository definitions, secrets and local documents
    volumes:
      - ./config.yaml:/etc/adapter/config.yaml:ro
      - spool:/var/spool/adapter   # disk-backed spool (not RAM)
      - state:/var/lib/zaks-drive                  # managed repositories: definitions, secrets, local documents (back this up)
    ports:
      # Host ports are configurable in deploy/.env when they are already taken
      # (Ubuntu's Cockpit uses 9090). Container ports stay fixed.
      - "${BIND_ADDRESS:-0.0.0.0}:${REST_PORT:-8080}:8080"   # Document REST API
      - "${BIND_ADDRESS:-0.0.0.0}:${CS_PORT:-8090}:8090"     # SAP Content Server HTTP interface (OAC0)
      - "127.0.0.1:${ADMIN_PORT:-9090}:9090"       # metrics/health: localhost only
    tmpfs:
      - /tmp:size=64m
    read_only: true
    security_opt: ["no-new-privileges:true"]
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD", "/zaks-drive-server", "-healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    # Transfer buffers are capped by transfer.memoryBudgetBytes (512 MiB by
    # default); 1 GiB leaves room for the Go runtime and connections.
    mem_limit: 1g

volumes:
  spool:
  state:
